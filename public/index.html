<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1a73e8">
  <script>
    // Terapkan tema tersimpan sedini mungkin agar tidak berkedip
    (function () {
      try {
        if (localStorage.getItem('scanstock.theme') === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) {}
    })();
  </script>
  <title>POS & Stock Entry System</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Scan Stock">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <script src="vendor/html5-qrcode.min.js"></script>
  <script>
    // Cadangan: dipakai bila config.js gagal dimuat (cache lama, pemblokir, dll.).
    // Nilai di config.js tetap diutamakan kalau valid.
    window.APP_DEFAULTS = {
      API_URL: "https://script.google.com/macros/s/AKfycbzpxd_u_pFIDunZyh50aQRIMBlvdWZ5Ot3VCevsVKTX2kEGRytqOxkFOf6hyX-9Rfh7/exec",
      POLL_SECONDS: 60
    };
  </script>
  <script src="config.js" onerror="window.__configGagal = true; console.warn('config.js gagal dimuat, memakai nilai cadangan di index.html')"></script>
  <style>
    :root {
      --bg-primary: #f4f6f9;
      --bg-card: #ffffff;
      --text-main: #202124;
      --text-muted: #5f6368;
      --accent: #1a73e8;
      --accent-hover: #1557b0;
      --btn-secondary-bg: #e8f0fe;
      --btn-secondary-text: #1a73e8;
      --border-color: #dadce0;
      --card-bg-sub: #f8f9fa;
      --modal-overlay: rgba(0, 0, 0, 0.5);
      --safe-area-bottom: env(safe-area-inset-bottom, 0px);
      --alert: #c5221f;            /* teks/ikon peringatan di atas latar terang */
      --alert-bg: #fce8e6;
      --alert-border: #f5b8b3;
      --badge-bg: #d93025;
      --badge-text: #ffffff;
    }

    [data-theme="dark"] {
      --bg-primary: #121212;
      --bg-card: #1e1e1e;
      --text-main: #e8eaed;
      --text-muted: #9aa0a6;
      --accent: #8ab4f8;
      --accent-hover: #aecbfa;
      --btn-secondary-bg: #2d3748;
      --btn-secondary-text: #8ab4f8;
      --border-color: #3c4043;
      --card-bg-sub: #282a2d;
      --modal-overlay: rgba(0, 0, 0, 0.75);
      --alert: #f28b82;            /* merah muda terang agar terbaca di latar gelap */
      --alert-bg: #3b2022;
      --alert-border: #6b3a3d;
      --badge-bg: #d93025;
      --badge-text: #ffffff;
    }

    * { 
      box-sizing: border-box; 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      -webkit-text-size-adjust: 100%;
      background-color: var(--bg-primary);
      color: var(--text-main);
      overflow-x: hidden;
    }

    body {
      padding: calc(12px + env(safe-area-inset-top, 0px)) calc(12px + env(safe-area-inset-right, 0px)) calc(12px + var(--safe-area-bottom)) calc(12px + env(safe-area-inset-left, 0px));
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .container { 
      width: 100%; 
      max-width: 540px; 
      background: var(--bg-card); 
      padding: clamp(14px, 4vw, 24px); 
      border-radius: 16px; 
      box-shadow: 0 4px 20px rgba(0,0,0,0.06); 
      border: 1px solid var(--border-color);
    }
    
    .header { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      margin-bottom: 12px; 
    }
    .header h2 { 
      margin: 0; 
      font-size: clamp(16px, 4.5vw, 20px); 
      color: var(--accent); 
      font-weight: 700;
    }

    .user-bar { 
      display: flex; 
      flex-wrap: wrap;
      gap: 8px;
      justify-content: space-between; 
      align-items: center; 
      background: var(--card-bg-sub); 
      padding: 10px 12px; 
      border-radius: 10px; 
      margin-bottom: 14px; 
      font-size: 13px; 
      border: 1px solid var(--border-color); 
    }
    .role-badge { 
      font-weight: 700; 
      color: var(--accent); 
      text-transform: uppercase; 
    }

    .btn { 
      min-height: 44px;
      padding: 10px 16px; 
      border: 1px solid transparent; 
      border-radius: 10px; 
      font-weight: 600; 
      cursor: pointer; 
      font-size: 14px; 
      display: inline-flex; 
      align-items: center; 
      justify-content: center; 
      gap: 6px; 
      outline: none; 
      user-select: none;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary { background: var(--accent); color: #ffffff; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-secondary { background: var(--btn-secondary-bg); color: var(--btn-secondary-text); border-color: var(--border-color); }

    #reader { 
      width: 100%; 
      border-radius: 12px; 
      overflow: hidden; 
      margin-bottom: 14px; 
      display: none; 
      border: 1px solid var(--border-color); 
      background: #000000;
    }
    
    .input-group { 
      display: flex; 
      gap: 8px; 
      margin-bottom: 14px; 
    }
    input[type="text"], input[type="number"], input[type="password"], select { 
      width: 100%;
      min-height: 44px;
      padding: 10px 12px; 
      border: 1px solid var(--border-color); 
      background: var(--bg-card); 
      color: var(--text-main); 
      border-radius: 10px; 
      font-size: 16px; /* Mencegah Auto-Zoom di iOS Safari */
      outline: none; 
      -webkit-appearance: none;
    }
    input:focus, select:focus { border-color: var(--accent); }

    /* Segmented Control untuk Pilihan Role */
    .segmented-role {
      display: flex;
      background: var(--card-bg-sub);
      padding: 4px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      gap: 4px;
      margin-bottom: 8px;
    }
    .segmented-role label { flex: 1; cursor: pointer; user-select: none; }
    .segmented-role input[type="radio"] { position: absolute; opacity: 0; pointer-events: none; }
    .segmented-role span {
      display: block;
      text-align: center;
      padding: 11px 0;
      font-size: 14px;
      font-weight: 600;
      border-radius: 8px;
      color: var(--text-muted);
    }
    .segmented-role input[type="radio"]:checked + span {
      background: var(--accent);
      color: #ffffff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.12);
    }

    .card-result { 
      background: var(--card-bg-sub); 
      border-left: 5px solid var(--accent); 
      padding: 14px; 
      border-radius: 12px; 
      display: none; 
      margin-top: 14px; 
      border-top: 1px solid var(--border-color); 
      border-right: 1px solid var(--border-color); 
      border-bottom: 1px solid var(--border-color); 
    }
    .card-result.error { border-left-color: #ea4335; }
    .prod-id { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; word-break: break-all; }
    .prod-title { font-size: clamp(15px, 4vw, 17px); font-weight: 700; margin-bottom: 12px; color: var(--text-main); line-height: 1.3; }
    
    .price-qty-row { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      background: var(--bg-card); 
      padding: 12px; 
      border-radius: 10px; 
      margin-bottom: 12px; 
      border: 1px solid var(--border-color); 
    }
    .price-box { font-size: clamp(16px, 4.5vw, 19px); font-weight: 700; color: var(--accent); }

    .entry-form { 
      display: flex; 
      gap: 8px; 
      background: var(--bg-card); 
      padding: 8px; 
      border-radius: 10px; 
      border: 1px solid var(--border-color); 
    }
    .status-text { font-size: 12px; text-align: center; color: var(--text-muted); margin-bottom: 10px; }

    /* Modal Popup */
    .modal-overlay { 
      display: none; 
      position: fixed; 
      top: 0; left: 0; width: 100%; height: 100%; 
      background: var(--modal-overlay); 
      z-index: 2000; 
      align-items: center; 
      justify-content: center; 
      padding: 16px;
      backdrop-filter: blur(3px);
    }
    .modal-box { 
      background: var(--bg-card); 
      color: var(--text-main); 
      padding: 20px; 
      border-radius: 14px; 
      max-width: 320px; 
      width: 100%; 
      text-align: center; 
      box-shadow: 0 8px 30px rgba(0,0,0,0.25); 
      border: 1px solid var(--border-color); 
      animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popIn {
      from { transform: scale(0.85); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-title { font-size: 16px; font-weight: 700; margin-bottom: 8px; color: var(--accent); }
    .modal-box { max-height: 90vh; overflow-y: auto; }
    .modal-body { font-size: 14px; color: var(--text-muted); margin-bottom: 16px; line-height: 1.4; }

    /* Kamera: video selalu mengikuti lebar kontainer */
    #reader video { width: 100% !important; height: auto !important; max-height: 65vh; object-fit: cover; display: block; }
    #reader canvas { max-width: 100%; }

    /* Responsif */
    .btn { white-space: nowrap; }
    @media (min-width: 768px) {
      body { padding-top: 24px; }
      .container { max-width: 720px; }
    }
    @media (max-width: 380px) {
      .container { border-radius: 12px; }
      .price-qty-row { flex-wrap: wrap; gap: 6px; }
      .entry-form { flex-wrap: wrap; }
      .entry-form input, .entry-form .btn { flex: 1 1 100% !important; }
    }

    /* ===== Lonceng notifikasi ===== */
    .header-actions { display: flex; align-items: center; gap: 8px; }
    .bell-btn { position: relative; min-height: 36px; width: 40px; padding: 0; }
    .bell-icon { width: 18px; height: 18px; transform-origin: 50% 6%; }
    .bell-btn.has-alert { color: var(--alert); border-color: var(--alert-border); background: var(--alert-bg); }
    .bell-btn.ring .bell-icon { animation: bellRing 1.1s ease-in-out 2; }
    @keyframes bellRing {
      0% { transform: rotate(0); }
      10% { transform: rotate(18deg); }
      20% { transform: rotate(-16deg); }
      30% { transform: rotate(13deg); }
      40% { transform: rotate(-10deg); }
      50% { transform: rotate(7deg); }
      60% { transform: rotate(-4deg); }
      70% { transform: rotate(2deg); }
      100% { transform: rotate(0); }
    }
    .bell-badge {
      position: absolute; top: -7px; right: -7px;
      min-width: 20px; height: 20px; padding: 0 5px;
      border-radius: 10px; box-sizing: border-box;
      background: var(--badge-bg); color: var(--badge-text);
      border: 2px solid var(--bg-card);
      font-size: 11px; font-weight: 700; line-height: 16px; text-align: center;
    }
    .bell-badge.bump { animation: badgeBump 0.4s ease-out; }
    @keyframes badgeBump { 0% { transform: scale(0.6); } 60% { transform: scale(1.25); } 100% { transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) {
      .bell-btn.ring .bell-icon, .bell-badge.bump { animation: none; }
    }

    /* ===== Panel notifikasi & modal pencocokan ===== */
    .modal-box.wide { max-width: 420px; text-align: left; }
    .panel-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 4px; }
    .panel-sub { font-size: 12px; color: var(--text-muted); margin-bottom: 12px; }
    .notif-list { display: flex; flex-direction: column; gap: 8px; max-height: 52vh; overflow-y: auto; margin-bottom: 12px; }
    .notif-item {
      display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; cursor: pointer;
      background: var(--card-bg-sub); color: var(--text-main);
      border: 1px solid var(--border-color); border-left: 4px solid var(--alert);
      border-radius: 10px; padding: 10px; font-family: inherit;
    }
    .notif-item:hover { border-color: var(--accent); border-left-color: var(--alert); }
    .notif-no {
      flex: 0 0 auto; width: 26px; height: 26px; border-radius: 50%;
      background: var(--alert-bg); color: var(--alert); border: 1px solid var(--alert-border);
      font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center;
    }
    .notif-main { flex: 1 1 auto; min-width: 0; }
    .notif-name { font-size: 13px; font-weight: 600; line-height: 1.3; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .notif-meta { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .notif-side { flex: 0 0 auto; text-align: right; font-size: 12px; }
    .notif-diff { display: inline-block; margin-top: 3px; padding: 1px 8px; border-radius: 10px; font-weight: 700;
      background: var(--alert-bg); color: var(--alert); border: 1px solid var(--alert-border); }
    .notif-empty { text-align: center; color: var(--text-muted); font-size: 13px; padding: 22px 8px; }
    .notif-wait { font-size: 12px; color: var(--text-muted); background: var(--card-bg-sub); border: 1px dashed var(--border-color);
      border-radius: 8px; padding: 8px 10px; margin-bottom: 12px; }
    .recon-row { display: flex; gap: 8px; margin-bottom: 10px; }
    .recon-box { flex: 1; background: var(--card-bg-sub); border: 1px solid var(--border-color); border-radius: 10px; padding: 8px 10px; }
    .recon-label { font-size: 10px; letter-spacing: .4px; color: var(--text-muted); text-transform: uppercase; }
    .recon-value { font-size: 15px; font-weight: 700; margin-top: 2px; word-break: break-word; }
    .recon-field { width: 100%; box-sizing: border-box; margin: 4px 0 12px; }
    .btn-row { display: flex; gap: 8px; }
    .btn-row .btn { flex: 1; }
    /* ===== Pilih produk (pencarian kode singkat) ===== */
    .pick-item {
      display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; cursor: pointer;
      background: var(--card-bg-sub); color: var(--text-main); font-family: inherit;
      border: 1px solid var(--border-color); border-left: 4px solid var(--accent);
      border-radius: 10px; padding: 10px;
    }
    .pick-item:hover { border-color: var(--accent); }
    .pick-main { flex: 1 1 auto; min-width: 0; }
    .pick-kode { font-size: 14px; font-weight: 700; letter-spacing: .3px; }
    .pick-kode mark { background: var(--btn-secondary-bg); color: var(--text-main); border-radius: 3px; padding: 0 2px; outline: 1px solid var(--accent); }
    .pick-nama { font-size: 12px; color: var(--text-muted); margin-top: 2px; line-height: 1.3; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .pick-harga { flex: 0 0 auto; font-size: 12px; font-weight: 600; text-align: right; }
    #pilihModal { z-index: 2060; }
    #notifyModal { z-index: 2300; }
    #notifPanel { z-index: 2050; }
    #reconModal { z-index: 2100; }
    #confirmModal { z-index: 2200; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h2>Scan & Stock System</h2>
    <div class="header-actions">
      <button class="btn btn-secondary bell-btn" id="btnBell" style="display: none;" onclick="openNotifPanel()"
              title="Notifikasi selisih" aria-label="Notifikasi selisih kasir dan verifikator">
        <svg class="bell-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
        <span class="bell-badge" id="bellBadge" style="display: none;" aria-live="polite">0</span>
      </button>
      <button class="btn btn-secondary" style="min-height: 36px; padding: 4px 10px; font-size: 12px;" id="btnTheme" onclick="toggleTheme()">🌙 Dark</button>
    </div>
  </div>

  <div class="status-text" id="dbStatus">⏳ Memuat Master Produk...</div>

  <div class="user-bar" id="userBar" style="display: none;">
    <div>User: <strong id="currentUsername">-</strong> (<span class="role-badge" id="currentRole">-</span>)</div>
    <div style="display: flex; gap: 6px; align-items: center;">
      <select id="exportBranchSelect" style="display: none; width: auto; min-height: 34px; padding: 2px 6px; font-size: 12px;">
        <option value="kranggan">Kranggan</option>
        <option value="katedral">Katedral</option>
        <option value="santamaria">Santa Maria</option>
        <option value="athanasius">Athanasius</option>
        <option value="antonius">Antonius</option>
        <option value="paulus">Paulus</option>
      </select>
      <button class="btn btn-secondary" style="min-height: 34px; padding: 4px 10px; font-size: 12px;" onclick="downloadDataRekap()">📥 Rekap</button>
      <button class="btn btn-secondary" style="min-height: 34px; padding: 4px 10px; font-size: 12px;" onclick="logout()">Logout</button>
    </div>
  </div>

  <div id="loginSection" style="display: flex; flex-direction: column; gap: 10px;">
    <div style="font-size: 14px; font-weight: 600; text-align: center; color: var(--text-muted);">Pilih Cabang & Role Tugas</div>
    
    <select id="loginBranch">
      <option value="kranggan">Cabang - Kranggan</option>
      <option value="katedral">Cabang - Katedral</option>
      <option value="santamaria">Cabang - Santa Maria</option>
      <option value="athanasius">Cabang - Athanasius</option>
      <option value="antonius">Cabang - Antonius</option>
      <option value="paulus">Cabang - Paulus</option>
      <option value="admin">Super User (Admin)</option>
    </select>

    <div class="segmented-role" id="roleSelectionBox">
      <label>
        <input type="radio" name="userRole" value="KASIR" checked>
        <span>Kasir</span>
      </label>
      <label>
        <input type="radio" name="userRole" value="VERIFIKATOR">
        <span>Verifikator</span>
      </label>
    </div>

    <input type="password" id="loginPass" placeholder="Masukkan PIN / Password" inputmode="numeric">
    <button class="btn btn-primary" id="btnLogin" onclick="login()">Login</button>
  </div>

  <div id="appSection" style="display: none;">
    <div style="display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap;">
      <button class="btn btn-primary" style="flex: 1 1 140px;" onclick="startScanner()">📷 Buka Kamera</button>
      <button class="btn btn-secondary" onclick="stopScanner()">Tutup</button>
      <!-- Cadangan: buka aplikasi kamera bawaan HP lalu baca barcode dari foto -->
      <label class="btn btn-secondary" style="cursor: pointer;">📸 Foto
        <input type="file" id="photoInput" accept="image/*" capture="environment" hidden onchange="scanFromPhoto(this)">
      </label>
    </div>

    <div id="reader"></div>
    <div id="reader-file" style="display: none;"></div>

    <form onsubmit="cariManual(event)" class="input-group">
      <input type="text" id="barcodeInput" placeholder="Scan / ketik kode (boleh sebagian)..." autofocus autocomplete="off">
      <button type="submit" class="btn btn-primary" style="flex: 0 0 auto;">Cari</button>
    </form>

    <div id="resultCard" class="card-result">
      <div class="prod-id" id="resId">-</div>
      <div class="prod-title" id="resTitle">-</div>

      <div class="price-qty-row">
        <div>
          <div style="font-size: 11px; color: var(--text-muted);">HARGA PRODUK</div>
          <div class="price-box" id="resPrice">Rp 0</div>
        </div>
      </div>

      <div class="entry-form" id="entryForm">
        <input type="number" id="inputQty" placeholder="Jumlah Qty..." min="1" value="1" inputmode="numeric" pattern="[0-9]*" style="flex: 0.8;">
        <button class="btn btn-primary" id="btnSimpan" style="flex: 1.2;" onclick="simpanInputQty()">Simpan Input</button>
      </div>
    </div>
  </div>
</div>

<!-- Pilih produk dari kode singkat -->
<div class="modal-overlay" id="pilihModal">
  <div class="modal-box wide">
    <div class="modal-title" style="margin-bottom: 4px;">Pilih Produk</div>
    <div class="panel-sub" id="pilihSub">-</div>
    <div class="notif-list" id="pilihList"></div>
    <button class="btn btn-secondary" style="width: 100%;" onclick="tutupPilihProduk()">Batal</button>
  </div>
</div>

<!-- Panel daftar selisih -->
<div class="modal-overlay" id="notifPanel">
  <div class="modal-box wide">
    <div class="panel-head">
      <div class="modal-title" style="margin-bottom: 0;">Selisih Kasir &amp; Verifikator</div>
      <button class="btn btn-secondary" style="min-height: 32px; padding: 2px 10px; font-size: 12px;" onclick="refreshNotif()" id="btnRefreshNotif">↻ Muat ulang</button>
    </div>
    <div class="panel-sub" id="notifSub">-</div>
    <div class="notif-list" id="notifList"></div>
    <div class="notif-wait" id="notifWait" style="display: none;"></div>
    <button class="btn btn-secondary" style="width: 100%;" onclick="closeNotifPanel()">Tutup</button>
  </div>
</div>

<!-- Form pencocokan -->
<div class="modal-overlay" id="reconModal">
  <div class="modal-box wide">
    <div class="modal-title">Pencocokan Selisih</div>
    <div class="prod-id" id="reconKode">-</div>
    <div class="prod-title" id="reconNama" style="margin-bottom: 6px;">-</div>
    <div class="recon-row">
      <div class="recon-box"><div class="recon-label">Harga</div><div class="recon-value" id="reconHarga">-</div></div>
    </div>
    <div class="recon-row">
      <div class="recon-box"><div class="recon-label">Input Kasir</div><div class="recon-value" id="reconKasir">-</div></div>
      <div class="recon-box"><div class="recon-label">Input Verifikator</div><div class="recon-value" id="reconVerif">-</div></div>
    </div>
    <label class="recon-label" for="reconNilai">Nilai valid hasil pencocokan (Pcs)</label>
    <input type="number" id="reconNilai" class="recon-field" min="0" step="1" inputmode="numeric" pattern="[0-9]*" placeholder="Masukkan nilai yang disepakati...">
    <div class="btn-row">
      <button class="btn btn-secondary" onclick="closeRecon()">Batal</button>
      <button class="btn btn-primary" id="btnReconSimpan" onclick="mintaKonfirmasiRecon()">Simpan</button>
    </div>
  </div>
</div>

<!-- Konfirmasi "Sudah yakin?" -->
<div class="modal-overlay" id="confirmModal">
  <div class="modal-box">
    <div class="modal-title">Sudah yakin?</div>
    <div class="modal-body" id="confirmText">-</div>
    <div class="btn-row">
      <button class="btn btn-secondary" onclick="tutupKonfirmasi()">Batal</button>
      <button class="btn btn-primary" id="btnReconYa" onclick="simpanRecon()">Ya, Simpan</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="notifyModal">
  <div class="modal-box">
    <div class="modal-title" id="modalTitle">Berhasil</div>
    <div class="modal-body" id="modalMessage">Data jumlah produk telah disimpan.</div>
    <button class="btn btn-primary" style="width: 100%;" onclick="closeModal()">OK</button>
  </div>
</div>

<script>
  let productLookupMap = {};   // kunci HURUF BESAR: produk_id atau ISBN
  let productList = [];        // [{ idU, item }] untuk pencarian sebagian
  let currentUser = null;
  let activeItem = null;
  let session = null; // { token, user }
  const SESSION_KEY = 'scanstock.session.v1';

  // Gabungkan config.js (utama) dengan nilai cadangan di index.html
  function getConfig() {
    const d = window.APP_DEFAULTS || {};
    const c = window.APP_CONFIG || {};
    const valid = u => typeof u === 'string' && /^https:\/\/script\.google\.com\//.test(u);
    return {
      API_URL: valid(c.API_URL) ? c.API_URL : (valid(d.API_URL) ? d.API_URL : ''),
      POLL_SECONDS: Number(c.POLL_SECONDS) || Number(d.POLL_SECONDS) || 60
    };
  }

  // ---------- API (Google Apps Script sebagai backend) ----------
  // Content-Type text/plain sengaja dipakai agar tidak memicu preflight CORS.
  async function api(action, payload) {
    const url = getConfig().API_URL;
    if (!url) {
      const status = window.APP_CONFIG ? 'config.js termuat tetapi API_URL-nya tidak valid' : 'config.js TIDAK termuat';
      throw Object.assign(new Error('API_URL tidak ditemukan (' + status + '). Periksa config.js atau nilai cadangan di index.html.'), { code: 'CONFIG' });
    }
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 30000);
    try {
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(Object.assign({ action: action, token: session ? session.token : null }, payload || {})),
        signal: ctrl.signal
      });
      const data = await res.json();
      if (!data.ok) throw Object.assign(new Error(data.error || 'Permintaan gagal.'), { code: data.code || 'SERVER' });
      return data;
    } catch (err) {
      if (err.name === 'AbortError') throw Object.assign(new Error('Server terlalu lama merespons.'), { code: 'TIMEOUT' });
      if (err instanceof TypeError) throw Object.assign(new Error('Tidak dapat terhubung ke server. Periksa koneksi internet.'), { code: 'NETWORK' });
      throw err;
    } finally {
      clearTimeout(timer);
    }
  }

  function handleAuthError(err) {
    if (err && err.code === 'AUTH') {
      logout();
      showModal("Sesi Berakhir", "Silakan login kembali.");
      return true;
    }
    return false;
  }

  async function fetchMasterData() {
    const status = document.getElementById('dbStatus');
    status.innerText = "⏳ Memuat Master Produk...";
    try {
      const res = await api('master');
      productLookupMap = {};
      productList = [];
      res.data.forEach(item => {
        if (!item.produk_id) return;
        const idU = String(item.produk_id).trim().toUpperCase();
        productLookupMap[idU] = item;
        productList.push({ idU: idU, item: item });
      });
      // ISBN dipakai sebagai kunci tambahan (tidak boleh menimpa produk_id yang sama)
      res.data.forEach(item => {
        const isbn = String(item.isbn || '').trim().replace(/[- ]/g, '').toUpperCase();
        if (isbn && !(isbn in productLookupMap)) productLookupMap[isbn] = item;
      });
      status.innerText = "✅ Database Siap (" + res.data.length + " Produk Loaded)";
    } catch (err) {
      if (handleAuthError(err)) return;
      status.innerText = "❌ Gagal memuat data master: " + err.message;
    }
  }

  async function login() {
    const branchSelect = document.getElementById('loginBranch').value;
    const selectedRole = document.querySelector('input[name="userRole"]:checked').value;
    const pass = document.getElementById('loginPass').value;
    if (!pass) return showModal("Peringatan", "Silahkan masukkan PIN / Password.");

    const btnLogin = document.getElementById('btnLogin');
    btnLogin.disabled = true;
    btnLogin.innerText = "Memeriksa...";
    try {
      const res = await api('login', { cabang: branchSelect, role: selectedRole, pin: pass });
      session = { token: res.token, user: res.user };
      try { localStorage.setItem(SESSION_KEY, JSON.stringify(session)); } catch (e) {}
      document.getElementById('loginPass').value = '';
      prosesMasuk();
    } catch (err) {
      showModal(err.code === 'SERVER' ? "Login Gagal" : "Gagal Login", err.message);
    } finally {
      btnLogin.disabled = false;
      btnLogin.innerText = "Login";
    }
  }

  function prosesMasuk() {
    currentUser = session.user;
    document.getElementById('loginSection').style.display = 'none';
    document.getElementById('appSection').style.display = 'block';
    document.getElementById('userBar').style.display = 'flex';
    document.getElementById('currentUsername').innerText = currentUser.username;
    document.getElementById('currentRole').innerText = currentUser.role + " (" + currentUser.cabang.toUpperCase() + ")";
    document.getElementById('exportBranchSelect').style.display = (currentUser.role === 'ADMIN') ? 'inline-block' : 'none';
    fetchMasterData();
    startPolling();
  }

  function logout() {
    currentUser = null;
    session = null;
    productLookupMap = {};
    productList = [];
    activeItem = null;
    try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
    document.getElementById('loginSection').style.display = 'flex';
    document.getElementById('appSection').style.display = 'none';
    document.getElementById('userBar').style.display = 'none';
    document.getElementById('resultCard').style.display = 'none';
    document.getElementById('dbStatus').innerText = "Silakan login untuk memuat data produk.";
    stopScanner();
    resetNotif();
  }

  function tampilkanProduk(item) {
    const card = document.getElementById('resultCard');
    activeItem = item;
    document.getElementById('resId').innerText = "ID: " + item.produk_id + (item.isbn ? " | ISBN: " + item.isbn : "");
    document.getElementById('resTitle').innerText = item.nama_produk;
    document.getElementById('resPrice').innerText = "Rp " + Number(item.harga).toLocaleString('id-ID');
    card.className = "card-result";
    card.style.display = "block";
    if (!isScanning) document.getElementById('inputQty').focus();
    card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function produkTidakDitemukan(kode) {
    const card = document.getElementById('resultCard');
    activeItem = null;
    document.getElementById('resId').innerText = "Kode dicari: " + kode;
    document.getElementById('resTitle').innerText = "Produk Tidak Ditemukan";
    document.getElementById('resPrice').innerText = "Rp 0";
    card.className = "card-result error";
    card.style.display = "block";
  }

  // Kode persis (produk_id atau ISBN), tanpa peduli huruf besar/kecil. Dipakai oleh scanner kamera & foto.
  function lookupProduct(scannedCode) {
    if (!scannedCode) return;
    const key = String(scannedCode).trim().replace(/[- ]/g, '').toUpperCase();
    const item = productLookupMap[key];
    if (item) tampilkanProduk(item); else produkTidakDitemukan(scannedCode);
  }

  async function simpanInputQty() {
    const qtyVal = parseInt(document.getElementById('inputQty').value) || 0;
    if (!activeItem) return;
    if (qtyVal <= 0) return showModal("Peringatan", "Jumlah produk harus lebih dari 0.");

    const btn = document.getElementById('btnSimpan');
    btn.innerText = "Simpan...";
    btn.disabled = true;

    try {
      // Cabang, role, user, nama & harga ditentukan server dari sesi dan sheet Master
      const res = await api('simpan', { produk_id: activeItem.produk_id, qty: qtyVal });
      document.getElementById('inputQty').value = 1;
      resumeScanner();
      pollNotif(true);
      showModal("Berhasil Disimpan", `Tercatat (${currentUser.role}) +${qtyVal} Pcs ${activeItem.nama_produk} di ${currentUser.cabang.toUpperCase()}. Total input ${currentUser.role.toLowerCase()} untuk produk ini: ${res.total} Pcs.`);
    } catch (err) {
      if (handleAuthError(err)) return;
      showModal("Gagal Menyimpan", err.message);
    } finally {
      btn.innerText = "Simpan Input";
      btn.disabled = false;
    }
  }

  // ---------- Rekap: file Excel dengan baris abu-abu muda jika selisih kasir vs verifikator != 0 ----------
  function loadScriptOnce(src) {
    return new Promise((resolve, reject) => {
      if (window.ExcelJS) return resolve();
      const el = document.createElement('script');
      el.src = src;
      el.onload = resolve;
      el.onerror = () => reject(new Error('Pustaka Excel gagal dimuat. Periksa koneksi internet.'));
      document.head.appendChild(el);
    });
  }

  async function buildRekapBuffer(rows, cabang) {
    const wb = new ExcelJS.Workbook();
    const ws = wb.addWorksheet(('Rekap ' + cabang).slice(0, 31));
    ws.columns = [
      { header: 'produk_id', width: 16 },
      { header: 'nama_produk', width: 56 },
      { header: 'harga', width: 12 },
      { header: 'qty_kasir', width: 12 },
      { header: 'qty_verifikator', width: 16 },
      { header: 'selisih', width: 10 }
    ];
    ws.getRow(1).font = { bold: true };
    ws.views = [{ state: 'frozen', ySplit: 1 }];

    rows.forEach((p, i) => {
      const n = i + 2;
      const selisih = p.qty_kasir - p.qty_verifikator;           // kolom D dikurangi kolom E
      const harga = Number(p.harga);
      const row = ws.addRow([
        String(p.produk_id),
        p.nama_produk,
        isNaN(harga) ? p.harga : harga,
        p.qty_kasir,
        p.qty_verifikator,
        { formula: `D${n}-E${n}`, result: selisih }
      ]);
      if (selisih !== 0) {                                       // minus atau plus: kolom A-F abu-abu muda
        for (let c = 1; c <= 6; c++) {
          row.getCell(c).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFD9D9D9' } };
        }
      }
    });
    return wb.xlsx.writeBuffer();
  }

  async function downloadDataRekap() {
    const targetCabang = (currentUser.role === 'ADMIN') ? document.getElementById('exportBranchSelect').value : currentUser.cabang;

    try {
      const res = await api('rekap', { cabang: targetCabang });
      if (!res.data || res.data.length === 0) {
        return showModal("Informasi", `Belum ada data transaksi di Sheet ${targetCabang.toUpperCase()}`);
      }
      await loadScriptOnce('vendor/exceljs.min.js');
      const buf = await buildRekapBuffer(res.data, targetCabang.toUpperCase());
      const blob = new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `Rekap_Perbandingan_${targetCabang.toUpperCase()}_${new Date().toISOString().slice(0,10)}.xlsx`;
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    } catch (err) {
      if (handleAuthError(err)) return;
      showModal("Gagal", "Gagal membuat rekap: " + err.message);
    }
  }

  function exportCSVFile(csvContentStr, fileName) {
    const blob = new Blob([csvContentStr], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement("a");
    const url = URL.createObjectURL(blob);
    link.setAttribute("href", url);
    link.setAttribute("download", fileName);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }

  function showModal(title, message) {
    document.getElementById('modalTitle').innerText = title;
    document.getElementById('modalMessage').innerText = message;
    document.getElementById('notifyModal').style.display = 'flex';
  }

  function closeModal() {
    document.getElementById('notifyModal').style.display = 'none';
  }

  const MIN_KODE_SEBAGIAN = 3;
  const MAKS_PILIHAN = 50;

  function cariManual(e) {
    e.preventDefault();
    const input = document.getElementById('barcodeInput');
    const raw = input.value.trim();
    if (!raw) return;
    cariFleksibel(raw);
    input.value = "";
  }

  // 1) kode persis  2) kode berakhiran yang diketik (23lb0001, lb0001)  3) kode memuat yang diketik
  function cariFleksibel(raw) {
    const key = raw.replace(/[\s-]/g, '').toUpperCase();
    const persis = productLookupMap[key];
    if (persis) return tampilkanProduk(persis);

    if (key.length < MIN_KODE_SEBAGIAN)
      return showModal("Kode Terlalu Pendek", `Ketik minimal ${MIN_KODE_SEBAGIAN} karakter terakhir dari kode produk, atau scan barcode-nya.`);

    let hasil = productList.filter(p => p.idU.endsWith(key));
    let mode = 'akhir';
    if (hasil.length === 0) {
      hasil = productList.filter(p => p.idU.includes(key));
      mode = 'sebagian';
    }
    if (hasil.length === 0) return produkTidakDitemukan(raw);
    if (hasil.length === 1) return tampilkanProduk(hasil[0].item);

    hasil.sort((x, y) => (x.idU < y.idU ? -1 : x.idU > y.idU ? 1 : 0));
    bukaPilihProduk(raw, key, hasil, mode);
  }

  function bukaPilihProduk(raw, key, hasil, mode) {
    const list = document.getElementById('pilihList');
    list.textContent = '';
    let sub = `${hasil.length} produk cocok dengan “${raw}”`;
    if (mode === 'sebagian') sub += ' (dicari di bagian mana pun dari kode)';
    if (hasil.length > MAKS_PILIHAN) sub += ` · menampilkan ${MAKS_PILIHAN} pertama, ketik kode lebih lengkap untuk mempersempit`;
    document.getElementById('pilihSub').textContent = sub;

    hasil.slice(0, MAKS_PILIHAN).forEach(p => {
      const kode = String(p.item.produk_id).trim();
      const i = mode === 'akhir' ? kode.length - key.length : p.idU.indexOf(key);

      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'pick-item';
      btn.onclick = () => { tutupPilihProduk(); tampilkanProduk(p.item); };

      const main = document.createElement('div'); main.className = 'pick-main';
      const kd = document.createElement('div'); kd.className = 'pick-kode';
      const hit = document.createElement('mark'); hit.textContent = kode.substr(i, key.length);
      kd.append(kode.substr(0, i), hit, kode.substr(i + key.length));
      const nm = document.createElement('div'); nm.className = 'pick-nama'; nm.textContent = p.item.nama_produk;
      main.append(kd, nm);

      const hg = document.createElement('div'); hg.className = 'pick-harga';
      hg.textContent = 'Rp ' + (Number(p.item.harga) || 0).toLocaleString('id-ID');

      btn.append(main, hg);
      list.appendChild(btn);
    });
    document.getElementById('pilihModal').style.display = 'flex';
  }

  function tutupPilihProduk() { document.getElementById('pilihModal').style.display = 'none'; }

  // ================= KAMERA / SCANNER =================
  let qrScanner = null;
  let isScanning = false;
  let lastScan = { code: '', time: 0 };

  function scannerOptions() {
    const F = Html5QrcodeSupportedFormats;
    return {
      formatsToSupport: [F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E, F.CODE_128, F.CODE_39, F.QR_CODE],
      experimentalFeatures: { useBarCodeDetectorIfSupported: true }, // jauh lebih akurat untuk barcode 1D di Chrome Android
      verbose: false
    };
  }

  function onScanSuccess(decodedText) {
    const now = Date.now();
    if (decodedText === lastScan.code && now - lastScan.time < 2000) return; // cegah baca ganda
    lastScan = { code: decodedText, time: now };
    if (navigator.vibrate) navigator.vibrate(60);
    try { qrScanner.pause(true); } catch (e) {}   // bekukan kamera sampai data disimpan
    lookupProduct(decodedText);
    if (!activeItem) setTimeout(resumeScanner, 1500); // produk tidak ketemu -> lanjut scan otomatis
  }

  function resumeScanner() {
    if (qrScanner && isScanning) {
      try { qrScanner.resume(); } catch (e) {}
    }
  }

  function cameraErrorMessage(err) {
    const name = (err && err.name) || '';
    const msg = String(err && err.message ? err.message : err);
    if (!window.isSecureContext) return "Kamera hanya bisa dipakai lewat HTTPS.";
    if ((name === 'NotAllowedError' || /permission|denied/i.test(msg)) && window.self !== window.top)
      return "Google Apps Script memblokir kamera langsung untuk halaman yang tampil di dalam iframe (" + (name || msg) + "). Ini batasan Apps Script, bukan izin browser. Gunakan tombol 📸 Foto, atau scanner barcode Bluetooth/USB.";
    if (name === 'NotAllowedError' || /permission|denied/i.test(msg))
      return "Akses kamera diblokir (" + (name || msg) + "). Izinkan kamera untuk situs ini di pengaturan browser, dan buka aplikasi lewat Chrome/Safari (bukan browser di dalam WhatsApp/Instagram). Jika tetap gagal, pakai tombol 📸 Foto.";
    if (name === 'NotFoundError' || /requested device not found/i.test(msg))
      return "Kamera tidak ditemukan di perangkat ini.";
    if (name === 'NotReadableError' || /could not start video/i.test(msg))
      return "Kamera sedang dipakai aplikasi lain. Tutup aplikasi/tab lain yang memakai kamera, lalu coba lagi.";
    return "Kamera gagal dibuka: " + (name ? name + " - " : "") + msg;
  }

  async function startScanner() {
    if (typeof Html5Qrcode === 'undefined')
      return showModal("Scanner Belum Siap", "Library scanner belum termuat. Periksa koneksi internet lalu muat ulang halaman.");
    if (isScanning) return resumeScanner();

    document.getElementById('reader').style.display = 'block';
    try {
      if (!qrScanner) qrScanner = new Html5Qrcode("reader", scannerOptions());
      await qrScanner.start(
        { facingMode: "environment" },
        {
          fps: 10,
          qrbox: (vw, vh) => {
            const w = Math.floor(Math.min(vw, 360) * 0.85);
            return { width: w, height: Math.floor(w * 0.55) };
          }
        },
        onScanSuccess,
        () => {}
      );
      isScanning = true;
    } catch (err) {
      isScanning = false;
      document.getElementById('reader').style.display = 'none';
      showModal("Kamera Tidak Bisa Dibuka", cameraErrorMessage(err));
    }
  }

  async function stopScanner() {
    try {
      if (qrScanner) {
        if (isScanning) await qrScanner.stop();
        qrScanner.clear();
      }
    } catch (e) { /* abaikan */ }
    qrScanner = null;
    isScanning = false;
    document.getElementById('reader').style.display = 'none';
  }

  // Cadangan jika kamera langsung diblokir: ambil foto via kamera bawaan HP, lalu baca barcode dari gambar
  async function scanFromPhoto(input) {
    const file = input.files && input.files[0];
    if (!file) return;
    try {
      if (typeof Html5Qrcode === 'undefined') throw new Error('Library scanner belum termuat');
      const tmp = new Html5Qrcode("reader-file", scannerOptions());
      const text = await tmp.scanFile(file, false);
      try { tmp.clear(); } catch (e) {}
      lookupProduct(text);
    } catch (err) {
      showModal("Barcode Tidak Terbaca", "Coba foto lagi dari jarak lebih dekat, pastikan barcode tajam, terang, dan memenuhi frame. Atau ketik kodenya manual.");
    }
    input.value = '';
  }

  const THEME_KEY = 'scanstock.theme';

  function applyTheme(theme) {
    const root = document.documentElement;
    const btn = document.getElementById('btnTheme');
    const meta = document.querySelector('meta[name="theme-color"]');
    if (theme === 'dark') {
      root.setAttribute('data-theme', 'dark');
      if (btn) btn.innerText = '☀️ Light';
      if (meta) meta.setAttribute('content', '#121212');
    } else {
      root.removeAttribute('data-theme');
      if (btn) btn.innerText = '🌙 Dark';
      if (meta) meta.setAttribute('content', '#1a73e8');
    }
  }

  function toggleTheme() {
    const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    applyTheme(next);
    try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
  }


  // ================= NOTIFIKASI SELISIH (polling) =================
  const POLL_MS = Math.max(5, getConfig().POLL_SECONDS) * 1000;
  let notif = { count: 0, items: [], menunggu: 0, updated: null };
  let notifSeen = false;       // sudah pernah menerima data dari server (untuk membedakan muatan awal)
  let pollTimer = null, polling = false, pollAgain = false;
  let reconItem = null, reconBusy = false;

  const rupiah = n => 'Rp ' + (Number(n) || 0).toLocaleString('id-ID');
  const bellAllowed = () => !!currentUser && (currentUser.role === 'KASIR' || currentUser.role === 'VERIFIKATOR');

  function startPolling() {
    stopPolling();
    if (!bellAllowed()) return;
    document.getElementById('btnBell').style.display = 'inline-flex';
    pollNotif(true);
    pollTimer = setInterval(() => pollNotif(false), POLL_MS);
  }

  function stopPolling() {
    if (pollTimer) clearInterval(pollTimer);
    pollTimer = null;
  }

  function resetNotif() {
    stopPolling();
    notif = { count: 0, items: [], menunggu: 0, updated: null };
    notifSeen = false;
    reconItem = null;
    ['notifPanel', 'reconModal', 'confirmModal', 'pilihModal'].forEach(id => document.getElementById(id).style.display = 'none');
    const bell = document.getElementById('btnBell');
    bell.style.display = 'none';
    bell.classList.remove('has-alert', 'ring');
    document.getElementById('bellBadge').style.display = 'none';
  }

  async function pollNotif(force) {
    if (!bellAllowed()) return;
    if (!force && document.hidden) return;        // tab tidak terlihat: hemat kuota server
    if (polling) { pollAgain = true; return; }
    polling = true;
    try {
      const res = await api('notif');
      applyNotif(res);
    } catch (err) {
      if (err.code === 'AUTH') handleAuthError(err);  // gangguan jaringan: diam, coba lagi di siklus berikutnya
    } finally {
      polling = false;
      if (pollAgain) { pollAgain = false; pollNotif(true); }
    }
  }

  function applyNotif(res) {
    const prev = notif.count;
    notif = { count: res.count || 0, items: res.items || [], menunggu: res.menunggu || 0, updated: new Date() };
    renderBell(prev);
    if (document.getElementById('notifPanel').style.display === 'flex') renderNotifList();
  }

  function renderBell(prev) {
    const bell = document.getElementById('btnBell');
    const badge = document.getElementById('bellBadge');
    bell.classList.toggle('has-alert', notif.count > 0);
    bell.title = notif.count > 0 ? `${notif.count} produk selisih` : 'Tidak ada selisih';
    bell.setAttribute('aria-label', bell.title);

    if (notif.count > 0) {
      const teks = notif.count > 99 ? '99+' : String(notif.count);
      if (badge.innerText !== teks) {
        badge.innerText = teks;
        badge.classList.remove('bump'); void badge.offsetWidth; badge.classList.add('bump');
      }
      badge.style.display = 'block';
    } else {
      badge.style.display = 'none';
    }

    // Lonceng berdentang saat ada selisih BARU (atau selisih sudah ada ketika pertama kali dibuka)
    if (notif.count > prev || (!notifSeen && notif.count > 0)) ringBell();
    notifSeen = true;
  }

  function ringBell() {
    const bell = document.getElementById('btnBell');
    bell.classList.remove('ring'); void bell.offsetWidth; bell.classList.add('ring');
    setTimeout(() => bell.classList.remove('ring'), 2400);
  }

  function jamLabel(ms) {
    const d = new Date(ms);
    const jam = d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }).replace('.', ':');
    const hariIni = new Date().toDateString() === d.toDateString();
    const tgl = hariIni ? '' : d.toLocaleDateString('id-ID', { day: '2-digit', month: '2-digit' }) + ' ';
    const mnt = Math.max(0, Math.round((Date.now() - ms) / 60000));
    const lalu = mnt < 1 ? 'baru saja' : mnt < 60 ? `${mnt} mnt lalu` : `${Math.floor(mnt / 60)} j ${mnt % 60} mnt lalu`;
    return `${tgl}${jam} · ${lalu}`;
  }

  function openNotifPanel() {
    document.getElementById('notifPanel').style.display = 'flex';
    renderNotifList();
    pollNotif(true);
  }

  function closeNotifPanel() { document.getElementById('notifPanel').style.display = 'none'; }

  async function refreshNotif() {
    const b = document.getElementById('btnRefreshNotif');
    b.disabled = true;
    await pollNotif(true);
    setTimeout(() => { b.disabled = false; }, 600);
  }

  function renderNotifList() {
    const list = document.getElementById('notifList');
    list.textContent = '';
    const cab = currentUser ? currentUser.cabang.toUpperCase() : '';
    const upd = notif.updated ? notif.updated.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' }).replace(/\./g, ':') : '-';
    document.getElementById('notifSub').textContent =
      `Cabang ${cab} · diperbarui ${upd} · urut dari selisih terlama · cek otomatis tiap ${Math.round(POLL_MS / 1000)} detik (POLL_SECONDS)`;

    if (notif.items.length === 0) {
      const e = document.createElement('div');
      e.className = 'notif-empty';
      e.textContent = 'Tidak ada selisih. Input kasir dan verifikator sudah sama untuk semua produk yang dicatat oleh keduanya.';
      list.appendChild(e);
    }
    notif.items.forEach((it, i) => {
      const diff = it.qty_kasir - it.qty_verifikator;
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'notif-item';
      btn.onclick = () => openRecon(i);

      const no = document.createElement('div'); no.className = 'notif-no'; no.textContent = String(i + 1);
      const main = document.createElement('div'); main.className = 'notif-main';
      const nm = document.createElement('div'); nm.className = 'notif-name'; nm.textContent = it.nama_produk;
      const mt = document.createElement('div'); mt.className = 'notif-meta'; mt.textContent = `${it.produk_id} · sejak ${jamLabel(it.sejak)}`;
      main.append(nm, mt);
      const side = document.createElement('div'); side.className = 'notif-side';
      const kv = document.createElement('div'); kv.textContent = `K ${it.qty_kasir} · V ${it.qty_verifikator}`;
      const df = document.createElement('span'); df.className = 'notif-diff'; df.textContent = (diff > 0 ? '+' : '') + diff;
      side.append(kv, df);
      btn.append(no, main, side);
      list.appendChild(btn);
    });

    const wait = document.getElementById('notifWait');
    if (notif.menunggu > 0) {
      wait.style.display = 'block';
      wait.textContent = `${notif.menunggu} produk baru diinput oleh satu pihak saja (menunggu pasangannya). Belum dihitung sebagai selisih.`;
    } else {
      wait.style.display = 'none';
    }
  }

  // ---------- Pencocokan ----------
  function openRecon(i) {
    const it = notif.items[i];
    if (!it) return;
    reconItem = it;
    document.getElementById('reconKode').textContent = it.produk_id;
    document.getElementById('reconNama').textContent = it.nama_produk;
    document.getElementById('reconHarga').textContent = rupiah(it.harga);
    document.getElementById('reconKasir').textContent = it.qty_kasir + ' Pcs';
    document.getElementById('reconVerif').textContent = it.qty_verifikator + ' Pcs';
    document.getElementById('reconNilai').value = '';
    document.getElementById('reconModal').style.display = 'flex';
    setTimeout(() => document.getElementById('reconNilai').focus(), 50);
  }

  function closeRecon() {
    if (reconBusy) return;
    document.getElementById('reconModal').style.display = 'none';
    reconItem = null;
  }

  function mintaKonfirmasiRecon() {
    if (!reconItem) return;
    const raw = document.getElementById('reconNilai').value.trim();
    const n = Number(raw);
    if (raw === '' || !Number.isInteger(n) || n < 0 || n > 100000)
      return showModal("Nilai Belum Valid", "Isi nilai hasil pencocokan dengan bilangan bulat 0 atau lebih.");
    document.getElementById('confirmText').textContent =
      `Nilai ${n} Pcs akan MENGGANTIKAN input kasir (${reconItem.qty_kasir}) dan verifikator (${reconItem.qty_verifikator}) untuk "${reconItem.nama_produk}". Data awal tetap tersimpan di sheet sebagai riwayat.`;
    document.getElementById('confirmModal').style.display = 'flex';
  }

  function tutupKonfirmasi() {
    if (reconBusy) return;
    document.getElementById('confirmModal').style.display = 'none';
  }

  async function simpanRecon() {
    if (!reconItem || reconBusy) return;
    const nilai = Number(document.getElementById('reconNilai').value);
    const it = reconItem;
    const yes = document.getElementById('btnReconYa');
    reconBusy = true; yes.disabled = true; yes.innerText = 'Menyimpan...';
    try {
      await api('rekonsiliasi', { produk_id: it.produk_id, nilai: nilai, lihat_kasir: it.qty_kasir, lihat_verifikator: it.qty_verifikator });
      reconBusy = false;
      document.getElementById('confirmModal').style.display = 'none';
      document.getElementById('reconModal').style.display = 'none';
      reconItem = null;
      showModal("Pencocokan Tersimpan", `${it.nama_produk}: nilai valid ${nilai} Pcs sudah menggantikan input kasir dan verifikator.`);
    } catch (err) {
      reconBusy = false;
      document.getElementById('confirmModal').style.display = 'none';
      if (handleAuthError(err)) return;
      if (err.code === 'STALE') {
        document.getElementById('reconModal').style.display = 'none';
        reconItem = null;
      }
      showModal(err.code === 'STALE' ? "Data Sudah Berubah" : "Gagal Menyimpan", err.message);
    } finally {
      reconBusy = false;
      yes.disabled = false; yes.innerText = 'Ya, Simpan';
      pollNotif(true);
    }
  }

  document.addEventListener('visibilitychange', () => { if (!document.hidden) pollNotif(true); });

  // ---------- Mulai ----------
  (function init() {
    applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light');
    document.getElementById('dbStatus').innerText = "Silakan login untuk memuat data produk.";
    try {
      const saved = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
      if (saved && saved.token && saved.user) { session = saved; prosesMasuk(); }
    } catch (e) {}

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  })();
</script>

</body>
